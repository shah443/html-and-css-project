<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      box-sizing: border-box;
      padding: 0;
      font-family: sans-serif;
    }
    header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: aqua;
      position: fixed;
      width: 100%;
      padding: 1rem 2rem;
      
      
    }
     header nav ul{
      list-style: none;
      display: flex;
      gap: 20px;

    }
     header button{
       padding:0.5rem 1.5rem;
       border-radius: 1rem;
       background-color: black;
       color: aliceblue;
       border: none;
       cursor: pointer;
    }
    main{
      height: 200vh;
      background-color: antiquewhite;
    }
  </style>
</head>
<body>
  <header>
    <h3>logo</h3>
    <nav>
      <ul>
        <li>HOME</li>
        <li>ABOUT</li>
        <li>CONTACT</li>
        <li>BLOG</li>
      </ul>
    </nav>
    <button>Login</button>
  </header>
  <main>

  </main>
</body>
</html>

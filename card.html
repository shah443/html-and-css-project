<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *{
        font-family: sans-serif;
      }
      .card{
        width: 25%;
        text-align: center;
        position: relative;
        cursor: pointer;
        padding-bottom: 3rem;
        border-radius: .5rem;
        transition: all .3s linear;
      }
      .card:hover{
        background-color: rgba(0, 0, 0, 0.162);
      }
      .card .img{
        border-top-left-radius: .5rem;
        border-top-right-radius: .5rem;
        width: 100%;
        height: 20rem;
        background-image:url("./assets/images/Capture.PNG") ;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
      .card .content p{
        color: rgba(0, 0, 0, 0.544);
      }
      .card .colors{
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .card .colors div{
        width: 1rem;
        height: 1rem;
        border-radius: 100%;
        cursor: pointer;
      }
      .card .colors div:first-child{
        background-color: gray;
      }
      .card .colors div:last-child{
        background-color: darkgreen;
      }
      .card .badge{
        background-color: red;
        border-radius: .3rem;
        padding: .3rem .7rem;
        font-size: .7rem;
        position: absolute;
        top: 3%;
        left: 5%;
      }
      
      </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        -50%
      </div>
      <div class="img">
      </div>
      <div class="content">
        <h3>The highland long puffer coat</h3>
        <p>$129.00</p>
        <div class="colors">
          <div></div>
          <div></div>
        </div>

      
      </div>
    </div>
  </body>
</html>
